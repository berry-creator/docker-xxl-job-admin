name: Build and Push XXL-Job-Admin Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'xxl-job 仓库中的 git tag'
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_REPO: letsdone/xxl-job-admin
    steps:
      - name: Checkout xxl-job repository
        uses: actions/checkout@v4
        with:
          repository: xuxueli/xxl-job
          ref: ${{ github.event.inputs.tag }}

      - name: Read JDK version from Dockerfile
        id: dockerfile
        shell: bash
        run: |
          set -euo pipefail

          image_ref="$(awk '$1 == "FROM" {
            for (field = 2; field <= NF; field++) {
              if ($field !~ /^--/) {
                print $field
                exit
              }
            }
          }' xxl-job-admin/Dockerfile)"
          image_tag="${image_ref##*:}"
          jdk_version="$(printf '%s' "$image_tag" | sed -E 's/^([0-9]+).*/\1/')"

          test -n "$image_ref"
          test "$jdk_version" != "$image_tag"
          printf 'image=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"
          printf 'jdk-version=%s\n' "$jdk_version" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.dockerfile.outputs.jdk-version }}
          cache: maven

      - name: Build xxl-job-admin
        run: mvn -B -ntp -pl xxl-job-admin -am package -DskipTests

      - name: Update Dockerfile base image
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E \
            -e 's#openjdk#eclipse-temurin#g' \
            -e 's#jre-slim#jre#g' \
            xxl-job-admin/Dockerfile

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: ./xxl-job-admin
          file: ./xxl-job-admin/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKERHUB_REPO }}:${{ github.event.inputs.tag }}
